name: Diagnose heyosya.ru DNS
on:
  workflow_dispatch:
permissions: {}
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install official Pages DNS checker
        run: |
          ruby --version
          gem install --user-install --no-document github-pages-health-check
      - name: Query with Pages resolver library
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'github-pages-health-check'
          require 'json'
          require 'time'
          puts JSON.generate({utc: Time.now.utc.iso8601, versions: Gem.loaded_specs.select { |k,_| ['github-pages-health-check','dnsruby'].include?(k) }.transform_values { |v| v.version.to_s }})
          modes = [:default, :public, ['ns1.reg.ru'], ['ns2.reg.ru']]
          names = ['heyosya.ru', 'www.heyosya.ru']
          modes.each do |mode|
            names.each do |name|
              r = GitHubPages::HealthCheck::Resolver.new(name, nameservers: mode)
              ['A','AAAA','CNAME','MX','NS','SOA','CAA'].each do |type|
                begin
                  answer = r.query(type).map(&:to_s)
                  puts JSON.generate({name: name, type: type, resolver: mode, ok: true, answer: answer})
                rescue StandardError => e
                  puts JSON.generate({name: name, type: type, resolver: mode, ok: false, error: e.class.name, message: e.message})
                end
              end
            end
            begin
              r = GitHubPages::HealthCheck::Resolver.new('_github-pages-challenge-heyosya.heyosya.ru', nameservers: mode)
              puts JSON.generate({name: '_github-pages-challenge-heyosya.heyosya.ru', type: 'TXT', resolver: mode, ok: true, answer: r.query('TXT').map(&:to_s)})
            rescue StandardError => e
              puts JSON.generate({type: 'TXT', resolver: mode, ok: false, error: e.class.name, message: e.message})
            end
          end
          RUBY
      - name: Strict HTTPS result
        run: |
          for url in https://heyosya.ru/ https://www.heyosya.ru/ https://heyosya.ru/voice/open.m4a; do
            curl -sS -I --max-time 15 "$url" || true
          done
